<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/highlight.css">
  <link rel="stylesheet" href="vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="vendor/codemirror/addon/dialog/dialog.css">
</head>
<body>
  <header class="topbar">
    <div class="title"><img src="icons/icon48.png" alt="" class="brand-logo">MarkLens</div>
    <div class="view-toggle" role="tablist" aria-label="Layout">
      <button id="tab-split" class="tab active" role="tab" aria-selected="true" data-view="split" title="Split view (Alt+1)">Split</button>
      <button id="tab-edit" class="tab" role="tab" aria-selected="false" data-view="edit" title="Editor only (Alt+2)">Edit</button>
      <button id="tab-preview" class="tab" role="tab" aria-selected="false" data-view="preview" title="Preview only (Alt+3)">Preview</button>
    </div>
    <div class="mode-toggle">
      <button id="mode-md" class="mode-btn active" title="Editor content is Markdown">MD</button>
      <button id="mode-html" class="mode-btn" title="Editor content is HTML — convert to Markdown">HTML</button>
    </div>
    <button id="zen-btn" class="icon-btn" title="Zen mode — distraction-free writing (Alt+Z)" aria-label="Zen mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>

  <div class="toolsbar">
    <div class="tool-grp">
      <label>Theme</label>
      <select id="tool-theme" title="Preview theme">
        <optgroup label="Solid">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="sepia">Sepia</option>
          <option value="nord">Nord</option>
          <option value="dracula">Dracula</option>
          <option value="github">GitHub Dark</option>
          <option value="solarized_light">Solarized Light</option>
          <option value="solarized_dark">Solarized Dark</option>
          <option value="monokai">Monokai</option>
          <option value="onedark">One Dark</option>
          <option value="gruvbox">Gruvbox</option>
          <option value="tokyo">Tokyo Night</option>
          <option value="everforest">Everforest</option>
          <option value="rosepine">Rosé Pine</option>
          <option value="github_light">GitHub Light</option>
          <option value="highcontrast">High Contrast</option>
        </optgroup>
        <optgroup label="Gradient">
          <option value="aurora">Aurora</option>
          <option value="sunset">Sunset</option>
          <option value="ocean">Ocean</option>
          <option value="midnight">Midnight</option>
          <option value="forest">Forest</option>
          <option value="candy">Candy</option>
        </optgroup>
      </select>
    </div>
    <div class="tool-divider"></div>
    <div class="tool-grp">
      <label>Size</label>
      <select id="tool-fontsize" title="Font size">
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="15">15</option>
        <option value="16">16</option>
        <option value="18">18</option>
        <option value="20">20</option>
      </select>
    </div>
    <div class="tool-divider"></div>
    <div class="tool-grp">
      <label>Font</label>
      <select id="tool-fontfamily" title="Font family">
        <option value='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'>System</option>
        <option value='Georgia, "Times New Roman", serif'>Serif</option>
        <option value='"Helvetica Neue", Arial, sans-serif'>Arial</option>
        <option value='"Courier New", Consolas, Menlo, monospace'>Mono</option>
        <option value='"Comic Sans MS", cursive'>Comic</option>
        <option value='Palatino, "Palatino Linotype", serif'>Palatino</option>
      </select>
    </div>
    <div class="tool-divider"></div>
    <div class="tool-grp">
      <label for="tool-keymap">Keys</label>
      <select id="tool-keymap" title="Editor key bindings">
        <option value="default">Default</option>
        <option value="vim">Vim</option>
      </select>
    </div>
  </div>

  <main id="workspace" class="view-split">
    <section class="pane editor-pane">
      <textarea id="editor" spellcheck="false" placeholder="# Write or paste Markdown here…

Select text on a page → right-click → “Preview as Markdown”"></textarea>
    </section>
    <section class="pane preview-pane">
      <article id="preview" class="markdown-body"></article>
    </section>
  </main>

  <footer class="statusbar">
    <div class="status-left">
      <span id="status" role="status">Live</span>
      <span id="counts" title="Word and character count"></span>
      <span id="draft-note" title="Draft autosaves locally in your browser"></span>
    </div>
    <div class="status-actions">
      <button id="dl-md-btn" title="Download as Markdown file" aria-live="polite">↓ MD</button>
      <button id="dl-html-btn" title="Download as styled HTML file" aria-live="polite">↓ HTML</button>
      <button id="print-btn" title="Print or save as PDF" aria-live="polite">PDF</button>
      <button id="clear-btn" title="Clear editor and preview" aria-live="polite">Clear</button>
      <button id="copy-btn" title="Copy rendered HTML (Ctrl+Enter / Ctrl+S)" aria-live="polite">Copy</button>
    </div>
  </footer>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/marked-footnote.umd.js"></script>
  <script src="vendor/marked-deflist.umd.js"></script>
  <script src="vendor/marked-emoji.umd.js"></script>
  <script src="vendor/emoji-map.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/marked-highlight.umd.js"></script>
  <script src="vendor/marked-extras.umd.js"></script>
  <script src="vendor/turndown.min.js"></script>
  <script src="vendor/turndown-plugin-gfm.js"></script>
  <script src="vendor/dompurify.min.js"></script>
  <script src="vendor/codemirror/codemirror.js"></script>
  <script src="vendor/codemirror/mode/xml/xml.js"></script>
  <script src="vendor/codemirror/mode/markdown/markdown.js"></script>
  <script src="vendor/codemirror/addon/display/placeholder.js"></script>
  <script src="vendor/codemirror/addon/search/searchcursor.js"></script>
  <script src="vendor/codemirror/addon/search/search.js"></script>
  <script src="vendor/codemirror/addon/dialog/dialog.js"></script>
  <script src="vendor/codemirror/keymap/vim.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/setupMarked.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sidepanel.js"></script>
</body>
</html>
