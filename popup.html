<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="popup-body">
  <div class="popup-wrap">
    <header class="popup-header">
      <img src="icons/icon48.png" alt="" class="popup-logo">
      <div class="popup-title">MarkLens</div>
    </header>

    <div class="popup-menu" role="menu" aria-label="Quick actions">
      <button class="popup-item" id="popup-open-tab" role="menuitem" autofocus>
        <span class="popup-item-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </span>
        <span class="popup-item-text">
          <span class="popup-item-label">Open as New Tab</span>
          <span class="popup-item-desc">Full-page editor with live preview</span>
        </span>
      </button>

      <button class="popup-item" id="popup-open-sidepanel" role="menuitem">
        <span class="popup-item-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
        </span>
        <span class="popup-item-text">
          <span class="popup-item-label">Open Side Panel</span>
          <span class="popup-item-desc">Docked editor on the right</span>
        </span>
      </button>

      <div class="popup-divider"></div>

      <button class="popup-item" id="popup-settings" role="menuitem">
        <span class="popup-item-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
        <span class="popup-item-text">
          <span class="popup-item-label">Settings</span>
          <span class="popup-item-desc">Theme, font, display mode</span>
        </span>
      </button>

      <button class="popup-item" id="popup-about" role="menuitem">
        <span class="popup-item-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </span>
        <span class="popup-item-text">
          <span class="popup-item-label">About</span>
          <span class="popup-item-desc">How to use &amp; shortcuts</span>
        </span>
      </button>
    </div>

    <footer class="popup-footer">
      <span class="popup-version" id="popup-version"></span>
      <div class="popup-mode-row">
        <label class="popup-mode-label" for="popup-mode-select">Default mode:</label>
        <select id="popup-mode-select">
          <option value="popup">Popup</option>
          <option value="sidebar">Side panel</option>
        </select>
      </div>
    </footer>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
